<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Daisy UI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header>
      <nav
        class="w-11/12 mx-auto flex justify-between items-center border-b-1 border-[#17171720] py-5"
      >
        <div class="logo">
          <img class="w-[120px]" src="./assets/Logo.png" alt="" />
        </div>
        <div class="sort">
          <label class="input">
            <svg
              class="h-[1em] opacity-50"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <g
                stroke-linejoin="round"
                stroke-linecap="round"
                stroke-width="2.5"
                fill="none"
                stroke="currentColor"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </g>
            </svg>
            <input id="searchInput" type="search" required placeholder="Search" />
          </label>
        </div>
        <div class="blogs">
          <button class="btn text-white bg-[#FF1F3D]">Sort By View</button>
        </div>
      </nav>
    </header>

    <nav id="category-container" class="flex py-5 justify-center gap-5">
      <!-- It come from disPlayCategories() in index.js  -->
      <button
        onclick="loadVideoes()"
        class="btn btn-sm text-white bg-[#FF1F3D]"
      >
        All
      </button>
    </nav>

    <section
      id="videContainer"
      class="w-11/12 mx-auto grid grid-cols-4 gap-5"
    ></section>

    <script src="./script/index.js"></script>
  </body>
</html>
